name = "doudizhu"
main = "worker.js"
compatibility_date = "2024-09-23"

# 静态资源（public/ 由 Cloudflare 边缘直接托管，免费额度内）
assets = { directory = "public", binding = "ASSETS" }

# Durable Objects：每个房间一个实例（Room），全局大厅索引一个实例（Lobby）
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_classes = ["Room", "Lobby"]
